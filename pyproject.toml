[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.2.0"
description = "JARVIS: a safe, modular personal AI assistant for Windows (Phase 2: voice input and spoken replies, preserving all Phase 1 safety controls)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rahul Kumar" }]
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
# Voice input/output. Kept optional so the core app and the test suite run
# without a microphone, a speech model, or audio tooling installed.
voice = [
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
    "pyttsx3>=2.90",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
jarvis = "app.main:main"

[tool.setuptools]
packages = ["app", "audio", "core", "security", "ui", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
