[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.6.0"
description = "JARVIS: a safe, modular personal AI assistant for Windows (Phase 6: hardening, secret-redacted logging, and Windows packaging), preserving all earlier safety controls."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rahul Kumar" }]
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
# Voice input/output. Kept optional so the core app and the test suite run
# without a microphone, a speech model, or audio tooling installed.
voice = [
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
    "pyttsx3>=2.90",
]
dev = [
    "pytest>=7.4",
]
# Packaging: build a standalone Windows executable (see README "Build a
# Windows executable" and the committed ``jarvis.spec``).
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
jarvis = "app.main:main"

[tool.setuptools]
packages = ["app", "audio", "core", "security", "ui", "config", "actions", "ai", "ai.providers", "storage"]
py-modules = ["logging_setup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
